<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Shop All Groceries — FreshCart</title>
<meta name="description" content="Browse 69 grocery essentials with filters for category, price, rating and discount. Prices in PKR." />
<link rel="stylesheet" href="css/styles.css" />
<meta property="og:type" content="website" />
<meta property="og:title" content="Shop All Groceries — FreshCart" />
<meta property="og:description" content="Browse 69 grocery essentials with filters for category, price, rating and discount. Prices in PKR." />
<meta property="og:image" content="https://project--e178b9d6-97e4-412b-a71c-56d7d12a4462.lovable.app/og-freshcart.jpg" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:image" content="https://project--e178b9d6-97e4-412b-a71c-56d7d12a4462.lovable.app/og-freshcart.jpg" />
</head>
<body data-page="shop">
<section class="wrap section">
  <h1>Shop the whole store</h1>
  <p class="muted" id="lead"></p>
  <input type="search" id="q" placeholder="Search products — try “milk”" aria-label="Search products" style="margin:1rem 0 1.5rem" />

  <div class="two-col">
    <aside class="card pad">
      <label class="field">Category
        <select id="cat"></select>
      </label>
      <label class="field">Price range (Rs.)
        <div class="row" style="margin-top:.35rem">
          <input type="number" id="min" placeholder="Min" step="50" min="0" aria-label="Minimum price" />
          <input type="number" id="max" placeholder="Max" step="50" min="0" aria-label="Maximum price" />
        </div>
      </label>
      <div class="field">Minimum rating
        <div class="row" style="flex-wrap:wrap;margin-top:.4rem" id="rateChips"></div>
      </div>
      <div class="field">Discount
        <div class="row" style="flex-wrap:wrap;margin-top:.4rem" id="offChips"></div>
      </div>
      <button class="btn ghost block" onclick="resetFilters()">Clear filters</button>
    </aside>

    <div>
      <div class="between">
        <span class="small muted" id="count"></span>
        <select id="sort" style="max-width:220px">
          <option value="popular">Most Popular</option>
          <option value="price-asc">Price: Low to High</option>
          <option value="price-desc">Price: High to Low</option>
          <option value="rating">Top Rated</option>
          <option value="discount">Biggest Discount</option>
          <option value="name">Name (A–Z)</option>
        </select>
      </div>
      <div class="grid products" id="grid" style="margin-top:1.25rem"></div>
      <div id="none" class="empty hide"><div class="big">🔍</div><h3>No products match those filters</h3><p class="muted">Try widening the price range or clearing filters.</p></div>
    </div>
  </div>
</section>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
let f = { q: "", cat: "", min: "", max: "", rate: 0, off: 0, sort: "popular", deal: false };

function initPage() {
  f.q = qs("q") || "";
  f.cat = qs("cat") || "";
  f.deal = qs("deal") === "1";
  document.getElementById("q").value = f.q;

  document.getElementById("cat").innerHTML =
    `<option value="">All categories</option>` +
    CATEGORIES.map((c) => `<option value="${c.id}" ${c.id === f.cat ? "selected" : ""}>${c.name}</option>`).join("");

  document.getElementById("rateChips").innerHTML = [0, 4, 4.5, 4.8]
    .map((r) => `<button class="chip" data-rate="${r}" onclick="setF('rate',${r})">${r === 0 ? "Any" : r + "★ +"}</button>`).join("");
  document.getElementById("offChips").innerHTML = [0, 10, 20, 25]
    .map((r) => `<button class="chip" data-off="${r}" onclick="setF('off',${r})">${r === 0 ? "Any" : r + "% +"}</button>`).join("");

  document.getElementById("q").oninput = (e) => { f.q = e.target.value; render(); };
  document.getElementById("cat").onchange = (e) => { f.cat = e.target.value; render(); };
  document.getElementById("min").oninput = (e) => { f.min = e.target.value; render(); };
  document.getElementById("max").oninput = (e) => { f.max = e.target.value; render(); };
  document.getElementById("sort").onchange = (e) => { f.sort = e.target.value; render(); };
  render();
}

function setF(k, v) { f[k] = v; render(); }
function resetFilters() {
  f = { q: "", cat: "", min: "", max: "", rate: 0, off: 0, sort: f.sort, deal: false };
  document.getElementById("q").value = "";
  document.getElementById("cat").value = "";
  document.getElementById("min").value = "";
  document.getElementById("max").value = "";
  render();
}

function render() {
  document.querySelectorAll("[data-rate]").forEach((b) => b.classList.toggle("on", Number(b.dataset.rate) === f.rate));
  document.querySelectorAll("[data-off]").forEach((b) => b.classList.toggle("on", Number(b.dataset.off) === f.off));

  const term = f.q.trim().toLowerCase();
  let list = PRODUCTS.filter((p) => {
    if (f.cat && p.category !== f.cat) return false;
    if (f.deal && !p.deal) return false;
    if (f.min !== "" && p.price < Number(f.min)) return false;
    if (f.max !== "" && p.price > Number(f.max)) return false;
    if (p.rating < f.rate) return false;
    if (discountPercent(p) < f.off) return false;
    if (term && !(`${p.name} ${p.description} ${getCategory(p.category)?.name}`.toLowerCase().includes(term))) return false;
    return true;
  });

  const sorters = {
    popular: (a, b) => b.sold - a.sold,
    "price-asc": (a, b) => a.price - b.price,
    "price-desc": (a, b) => b.price - a.price,
    rating: (a, b) => b.rating - a.rating,
    discount: (a, b) => discountPercent(b) - discountPercent(a),
    name: (a, b) => a.name.localeCompare(b.name),
  };
  list = [...list].sort(sorters[f.sort]);

  document.getElementById("lead").textContent = `${PRODUCTS.length} everyday essentials, filtered exactly how you like them.`;
  document.getElementById("count").textContent = `${list.length} product${list.length === 1 ? "" : "s"} found`;
  document.getElementById("grid").innerHTML = productGrid(list);
  document.getElementById("none").classList.toggle("hide", list.length > 0);
}
</script>
</body>
</html>
