<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Grocery Categories — FreshCart</title>
<meta name="description" content="Browse all fifteen FreshCart aisles: fresh produce, dairy, bakery, snacks, rice, frozen food, personal care and more." />
<link rel="stylesheet" href="css/styles.css" />
<meta property="og:type" content="website" />
<meta property="og:title" content="Grocery Categories — FreshCart" />
<meta property="og:description" content="Browse all fifteen FreshCart aisles: fresh produce, dairy, bakery, snacks, rice, frozen food, personal care and more." />
<meta property="og:image" content="https://project--e178b9d6-97e4-412b-a71c-56d7d12a4462.lovable.app/og-freshcart.jpg" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:image" content="https://project--e178b9d6-97e4-412b-a71c-56d7d12a4462.lovable.app/og-freshcart.jpg" />
</head>
<body data-page="categories">
<section class="wrap section">
  <span class="pill">15 aisles</span>
  <h1 style="margin-top:.75rem">Every aisle in the store</h1>
  <p class="muted">Pick an aisle and we'll take you straight to the shelf.</p>
  <div class="grid" id="grid" style="margin-top:1.75rem;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))"></div>
</section>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
function initPage() {
  document.getElementById("grid").innerHTML = CATEGORIES.map((c) => {
    const items = PRODUCTS.filter((p) => p.category === c.id);
    const cheapest = Math.min(...items.map((p) => p.price));
    return `
    <a class="card cat-card" href="shop.html?cat=${c.id}" style="display:flex;flex-direction:column">
      <div style="position:relative">
        <img src="${categoryImage(c.id)}" alt="${c.name}" width="768" height="768" loading="lazy" decoding="async" style="aspect-ratio:16/10" />
        <span class="tag-fresh" style="left:auto;right:.6rem;top:.6rem;bottom:auto">${items.length} items</span>
      </div>
      <div style="padding:1.1rem;display:flex;flex-direction:column;flex:1">
        <h3>${c.emoji} ${c.name}</h3>
        <p class="small muted" style="flex:1">${c.blurb}</p>
        <div class="between small" style="font-weight:700"><span>From ${money(cheapest)}</span><span style="color:var(--primary)">Shop aisle →</span></div>
      </div>
    </a>`;
  }).join("");
}
</script>
</body>
</html>
